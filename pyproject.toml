[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plotting-resources"
version = "0.1.0"
description = "Reusable scientific plotting templates in the selected R1/S3 style"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["matplotlib>=3.10", "numpy>=2.0"]

[project.optional-dependencies]
examples = ["PyMuPDF>=1.25", "Pillow>=11", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plotting_resources = ["selected_style.json"]
